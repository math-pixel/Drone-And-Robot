<!-- index.html -->
<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Answer 1 (Test Activity)</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header>
    <div class="badge" id="status">DISCONNECTED</div>
    <div class="small">ws://192.168.1.13:8057/ws</div>
  </header>

  <!-- CONNECT -->
  <main class="wrap" id="screenConnect">
    <div class="card">
      <h1>Answer 1</h1>
      <p class="muted">Connecte-toi au serveur, puis attends une question.</p>
      <button id="btnConnect">Connect</button>
      <div class="small muted mt" id="hint">—</div>

      <details class="debug">
        <summary>Debug</summary>
        <textarea id="log" readonly></textarea>
      </details>
    </div>
  </main>

  <!-- ANSWER -->
  <main class="wrap hidden" id="screenAnswer">
    <div class="card center">
      <div class="pill" id="actionLabel">Action: —</div>
      <button class="answerBtn" id="btnAnswer" disabled>—</button>
      <div class="small muted mt" id="answerHint">Clique pour envoyer la réponse.</div>

      <details class="debug">
        <summary>Debug</summary>
        <textarea id="log2" readonly></textarea>
      </details>
    </div>
  </main>

  <script src="./app.js"></script>
</body>
</html>
