<!-- index.html (modifs minimales) -->
<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Answer 2</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>

  <!-- CONNECT -->
  <main class="screen" id="screenPick">
    <div class="paper">
      <div style="display:flex; gap:24px;">
        <button class="btnPick" data-pick="1">1</button>
        <button class="btnPick" data-pick="2">2</button>
        <button class="btnPick" data-pick="3">3</button>
      </div>
    </div>
  </main>
  
  <!-- index.html : MODIFIE screenConnect pour qu’il soit hidden au départ -->
  <main class="screen hidden" id="screenConnect">
    <div class="paper">
      <button class="btnConnect" id="btnConnect">CONNECT</button>
    </div>
  </main>

  <!-- READY / START -->
  <main class="screen hidden" id="screenStart">
    <button class="btn btnFullStart" id="btnStart" disabled>COMMENCER</button>
  </main>

  <!-- ANSWER (tout l’écran cliquable) -->
  <main class="screen hidden" id="screenAnswer">
    <button class="btnLetter" id="btnLetter" disabled>—</button>
  </main>

  <script src="../test_activity/config.js"></script>
  <script src="./app.js"></script>
</body>
</html>
